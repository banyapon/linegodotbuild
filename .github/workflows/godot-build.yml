name: Godot build
run-name: Build ${{ inputs.target }} (${{ inputs.request_id || 'manual' }})
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [web, windows]
        default: web
        required: true
      line_user_id:
        description: LINE recipient (empty for manual builds)
        type: string
      request_id:
        description: LINE event ID
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_VERSION: ${{ vars.GODOT_VERSION }}
      GAME_PATH: ${{ vars.GODOT_PROJECT_PATH || 'game' }}
      TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate project and version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GODOT_VERSION" =~ ^4\.[0-9]+(\.[0-9]+)?$ ]] || { echo 'Set GODOT_VERSION repository variable to the exact Godot 4 stable version used by your game'; exit 1; }
          test -f "$GAME_PATH/project.godot"
          test -f "$GAME_PATH/export_presets.cfg"
          if find "$GAME_PATH" -name '*.cs' -print -quit | grep -q .; then
            echo 'This starter supports GDScript. Configure .NET builds before using C#.'; exit 1
          fi
      - name: Install matching Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo /tmp/godot >> "$GITHUB_PATH"
          ln -s "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /tmp/godot/godot
          unzip -q /tmp/templates.zip -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -r /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Import and export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build/$TARGET"
          godot --headless --path "$GAME_PATH" --editor --import
          case "$TARGET" in
            web) godot --headless --path "$GAME_PATH" --export-release Web "$GITHUB_WORKSPACE/build/web/index.html" ;;
            windows) godot --headless --path "$GAME_PATH" --export-release Windows "$GITHUB_WORKSPACE/build/windows/game.exe" ;;
            *) exit 1 ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: godot-${{ inputs.target }}-${{ github.run_number }}
          path: build/${{ inputs.target }}/
          if-no-files-found: error
          retention-days: 14
  notify:
    needs: build
    if: ${{ always() && inputs.line_user_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Notify LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_ALLOWED_USER_IDS: ${{ secrets.LINE_ALLOWED_USER_IDS }}
          LINE_USER_ID: ${{ inputs.line_user_id }}
          RESULT: ${{ needs.build.result }}
          TARGET: ${{ inputs.target }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: python
        run: |
          import os, json, urllib.request, uuid
          recipient = os.environ['LINE_USER_ID']
          allowed = [x.strip() for x in os.environ['LINE_ALLOWED_USER_IDS'].split(',') if x.strip()]
          if recipient not in allowed:
              raise SystemExit('LINE recipient is not allowed')
          result = os.environ['RESULT']
          text = f"Build {os.environ['TARGET']}: {result}\n{os.environ['RUN_URL']}"
          if result == 'success':
              text += '\nDownload from Artifacts (GitHub login required).'
          request = urllib.request.Request('https://api.line.me/v2/bot/message/push',
              data=json.dumps({'to': recipient, 'messages': [{'type': 'text', 'text': text}]}).encode(),
              headers={'Authorization': 'Bearer ' + os.environ['LINE_CHANNEL_ACCESS_TOKEN'],
                  'Content-Type': 'application/json', 'X-Line-Retry-Key': str(uuid.uuid4())})
          with urllib.request.urlopen(request, timeout=20) as response:
              print('LINE notification HTTP', response.status)
