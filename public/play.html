<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101d19"><title>เปิดเกม · LINE Game Studio</title><link rel="stylesheet" href="/play.css"></head>
<body><header class="play-header"><a href="/" aria-label="กลับ LINE Game Studio">◈ <span>LINE GAME STUDIO</span></a><span id="genre">YOUR WORLD</span><button id="pause" hidden>พัก</button></header>
<main class="game-shell"><div id="world" aria-label="สนามเกม"></div><section id="cover" class="screen"><div class="cover-content"><span class="eyebrow">A LITTLE WORLD, MADE FOR YOU</span><h1 id="game-title">กำลังเปิดโลกของคุณ…</h1><p id="game-description">รอสักครู่</p><button id="start" class="primary" disabled>กำลังโหลด…</button><p id="hint" class="hint"></p></div></section>
<div id="hud" class="hud" hidden><span>✦ <b id="score">0 / 8</b></span><span id="health">♥ 3</span><span id="timer">75s</span></div>
<section id="result" class="screen result" hidden><div class="cover-content"><span class="eyebrow">YOUR JOURNEY</span><h2 id="result-title"></h2><p id="result-text"></p><button id="restart" class="primary">เล่นอีกครั้ง ↗</button><a href="/">กลับสตูดิโอ</a></div></section></main>
<div class="game-bottom"><p>เก็บดาวให้ครบ · หลบศัตรู · พักด้วย P</p><div id="controls" class="dpad" hidden aria-label="ปุ่มเดินบนหน้าจอ"><button data-direction="up" aria-label="เดินขึ้น">↑</button><button data-direction="left" aria-label="เดินซ้าย">←</button><button data-direction="down" aria-label="เดินลง">↓</button><button data-direction="right" aria-label="เดินขวา">→</button></div><a href="/privacy">ความเป็นส่วนตัว</a></div><script type="module" src="/assets/main.js"></script></body></html>
